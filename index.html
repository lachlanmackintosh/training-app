<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lockie Training Program</title>
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lockie Training Program">

<link rel="icon" href="icons/icon-192.png">

</head>
<body>
<main id="view" aria-live="polite"></main>

<div id="timer" class="timer hidden" role="timer" aria-label="Rest timer">
  <div class="timer-bar"><div id="timer-fill"></div></div>
  <div class="timer-row">
    <div>
      <div class="timer-label" id="timer-label">Rest</div>
      <div class="timer-time" id="timer-time">0:00</div>
    </div>
    <div class="timer-btns">
      <button class="btn small ghost" data-act="timer-add" data-v="-15">−15 s</button>
      <button class="btn small ghost" data-act="timer-add" data-v="15">+15 s</button>
      <button class="btn small" data-act="timer-skip" id="timer-skip">Skip</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<nav class="tabs" id="tabs">
  <a href="#/home" data-tab="home"><span class="ti">🏠</span>Home</a>
  <a href="#/program" data-tab="program"><span class="ti">📋</span>Program</a>
  <a href="#/hiit" data-tab="hiit"><span class="ti">🥊</span>HIIT</a>
  <a href="#/mobility" data-tab="mobility"><span class="ti">🧘</span>Mobility</a>
  <a href="#/food" data-tab="food"><span class="ti">🥗</span>Food</a>
  <a href="#/history" data-tab="history"><span class="ti">📈</span>History</a>
  <a href="#/rules" data-tab="rules"><span class="ti">📏</span>Rules</a>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
