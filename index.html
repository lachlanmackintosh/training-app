<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lockie Training Program</title>
<meta name="theme-color" content="#0e1417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Program">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view" aria-live="polite"></main>

<div id="timer" class="timer hidden" role="timer" aria-label="Rest timer">
  <div class="timer-bar"><div id="timer-fill"></div></div>
  <div class="timer-row">
    <div>
      <div class="timer-label" id="timer-label">Rest</div>
      <div class="timer-time" id="timer-time">0:00</div>
    </div>
    <div class="timer-btns">
      <button class="btn small ghost" data-act="timer-add" data-v="-15">−15 s</button>
      <button class="btn small ghost" data-act="timer-add" data-v="15">+15 s</button>
      <button class="btn small" data-act="timer-skip" id="timer-skip">Skip</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<button type="button" id="ask-fab" class="askfab" data-act="ask-open" aria-label="Ask AI"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm-7-3a1 1 0 1 0-2 0 9 9 0 0 0 8 8.94V22h2v-2.06A9 9 0 0 0 21 11a1 1 0 1 0-2 0 7 7 0 0 1-14 0Z"/></svg><span>Ask AI</span></button>

<div id="ask" class="ask hidden" role="dialog" aria-modal="true" aria-labelledby="ask-title">
  <div class="ask-sheet">
    <div class="ask-head">
      <h2 id="ask-title">Ask AI</h2>
      <button type="button" class="btn small ghost" data-act="ask-clear">Clear</button>
      <button type="button" class="iconbtn" data-act="ask-close" aria-label="Close">✕</button>
    </div>
    <div id="ask-log" class="ask-log"></div>
    <form id="ask-form" class="ask-form" autocomplete="off">
      <div id="ask-live" class="ask-live hidden" aria-live="polite">Listening…</div>
      <label class="vh" for="ask-input">What you ate, or a question</label>
      <textarea id="ask-input" rows="5" placeholder="Type or dictate, then tap Send" enterkeyhint="send" autocapitalize="sentences" spellcheck="true"></textarea>
      <div class="ask-row">
        <button type="button" id="ask-mic" class="btn" data-act="ask-mic" aria-pressed="false">Speak</button>
        <button type="submit" class="btn ghost" id="ask-send">Send</button>
      </div>
      <p class="ask-note">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. What you type or say about food is sent to Google. The key stays on this phone.</p>
    </form>
  </div>
</div>

<nav class="tabs" id="tabs">
  <a href="#/home" data-tab="home"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.8 12 4l8 6.8V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.2Z"/></svg>Home</a>
  <a href="#/program" data-tab="program"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M4 10h16"/></svg>Program</a>
  <a href="#/hiit" data-tab="hiit"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5 5 13h6l-1 8.5L19 10h-6l0-7.5Z"/></svg>HIIT</a>
  <a href="#/mobility" data-tab="mobility"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7.5v5.2M8.2 11.2h7.6M9.2 21l2.8-8.3L14.8 21"/></svg>Mobility</a>
  <a href="#/food" data-tab="food"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12c0 4.5-2.6 7.5-6 7.5S6 14.5 6 10Z"/><path d="M8 17.5c1.1 1.2 2.4 1.8 4 1.8s2.9-.6 4-1.8"/></svg>Food</a>
  <a href="#/history" data-tab="history"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M7 16V10M12 16V6M17 16v-4"/></svg>History</a>
  <a href="#/rules" data-tab="rules"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h8l3 3V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M15 3.5V7h3M9 12h6M9 16h4"/></svg>Rules</a>
</nav>

<script src="data.js"></script>
<script src="food-ai.js"></script>
<script src="app.js"></script>
</body>
</html>
