<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<main id="view" aria-live="polite"></main>

<div id="timer" class="timer hidden" role="timer" aria-label="Rest timer">
  <div class="timer-bar"><div id="timer-fill"></div></div>
  <div class="timer-row">
    <div>
      <div class="timer-label" id="timer-label">Rest</div>
      <div class="timer-time" id="timer-time">0:00</div>
    </div>
    <div class="timer-btns">
      <button class="btn small ghost" data-act="timer-add" data-v="-15">−15 s</button>
      <button class="btn small ghost" data-act="timer-add" data-v="15">+15 s</button>
      <button class="btn small" data-act="timer-skip" id="timer-skip">Skip</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<nav class="tabs" id="tabs">
  <a href="#/home" data-tab="home"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.8 12 4l8 6.8V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.2Z"/></svg>Home</a>
  <a href="#/program" data-tab="program"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M4 10h16"/></svg>Program</a>
  <a href="#/hiit" data-tab="hiit"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5 5 13h6l-1 8.5L19 10h-6l0-7.5Z"/></svg>HIIT</a>
  <a href="#/mobility" data-tab="mobility"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7.5v5.2M8.2 11.2h7.6M9.2 21l2.8-8.3L14.8 21"/></svg>Mobility</a>
  <a href="#/food" data-tab="food"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12c0 4.5-2.6 7.5-6 7.5S6 14.5 6 10Z"/><path d="M8 17.5c1.1 1.2 2.4 1.8 4 1.8s2.9-.6 4-1.8"/></svg>Food</a>
