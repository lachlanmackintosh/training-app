<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lockie Training Program</title>
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lockie Training Program">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view" aria-live="polite"></main>

<div id="timer" class="timer hidden" role="timer" aria-label="Rest timer">
  <div class="timer-bar"><div id="timer-fill"></div></div>
  <div class="timer-row">
    <div>
      <div class="timer-label" id="timer-label">Rest</div>
      <div class="timer-time" id="timer-time">0:00</div>
    </div>
    <div class="timer-btns">
      <button class="btn small ghost" data-act="timer-add" data-v="-15">−15 s</button>
      <button class="btn small ghost" data-act="timer-add" data-v="15">+15 s</button>
      <button class="btn small" data-act="timer-skip" id="timer-skip">Skip</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<button type="button" id="ask-fab" class="askfab" data-act="ask-open" aria-label="Ask AI">🎤 <span>Ask AI</span></button>

<div id="ask" class="ask hidden" role="dialog" aria-modal="true" aria-labelledby="ask-title">
  <div class="ask-sheet">
    <div class="ask-head">
      <h2 id="ask-title">Ask AI</h2>
      <button type="button" class="btn small ghost" data-act="ask-clear">Clear</button>
      <button type="button" class="iconbtn" data-act="ask-close" aria-label="Close">✕</button>
    </div>
    <div id="ask-log" class="ask-log"></div>
    <form id="ask-form" class="ask-form" autocomplete="off">
      <div id="ask-live" class="ask-live hidden" aria-live="polite">Listening…</div>
      <label class="vh" for="ask-input">What you ate, or a question</label>
      <textarea id="ask-input" rows="2" placeholder="Type what you ate, or use the mic on the keyboard" enterkeyhint="send"></textarea>
      <div class="ask-row">
        <button type="button" id="ask-mic" class="btn" data-act="ask-mic">🎤 Speak</button>
        <button type="submit" class="btn ghost" id="ask-send">Send</button>
      </div>
      <p class="ask-note">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. What you type or say about food is sent to Google. The key stays on this phone.</p>
    </form>
  </div>
</div>

<nav class="tabs" id="tabs">
  <a href="#/home" data-tab="home"><span class="ti">🏠</span>Home</a>
  <a href="#/program" data-tab="program"><span class="ti">📋</span>Program</a>
  <a href="#/hiit" data-tab="hiit"><span class="ti">🥊</span>HIIT</a>
  <a href="#/mobility" data-tab="mobility"><span class="ti">🧘</span>Mobility</a>
  <a href="#/food" data-tab="food"><span class="ti">🥗</span>Food</a>
  <a href="#/history" data-tab="history"><span class="ti">📈</span>History</a>
  <a href="#/rules" data-tab="rules"><span class="ti">📏</span>Rules</a>
</nav>

<script src="data.js"></script>
<script src="food-ai.js"></script>
<script src="app.js"></script>
</body>
</html>
